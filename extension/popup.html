<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>English Notebook</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #273244;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.55;
    }
    h1 { margin: 0 0 2px; font-size: 15px; }
    .ver { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
    .block { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
    .block b { display: block; font-size: 12px; margin-bottom: 2px; }
    .muted { color: var(--muted); }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.97); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
    code { background: rgba(127,127,127,.15); padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>English Notebook</h1>
  <div class="ver" id="enb-ver">扩展已运行</div>

  <div class="block">
    <b>批注统计</b>
    <div id="stats" class="muted">读取中…</div>
  </div>

  <div class="block">
    <b>同步状态</b>
    <div id="sync" class="muted">检测中…</div>
  </div>

  <button id="btn-capture" class="primary">翻译并记录选中的英文</button>
  <button id="btn-options">设置 / 全部批注</button>
  <button id="btn-reload">重新加载扩展</button>

  <div class="hint">
    右键菜单只在<b>选中文字</b>时出现，位于菜单上部。若看不到菜单项：点“重新加载扩展”，再到 <code>edge://extensions</code> 确认没有被 Edge 关闭“开发人员模式扩展”。
  </div>

  <script src="popup.js"></script>
</body>
</html>
